appId: com.proxy.ripple
name: Notifications navigation
---
- launchApp:
    clearState: true
    clearKeychain: true

- extendedWaitUntil:
    visible: "you@example.com"
    timeout: 15000
- tapOn: "you@example.com"
- inputText: "cicero@gmail.com"
- tapOn: "Enter your password"
- inputText: "12345678"
- hideKeyboard
- tapOn: "Sign In"
- extendedWaitUntil:
    visible:
      id: "feed-list"
    timeout: 15000

- tapOn: "Notifications"
- extendedWaitUntil:
    visible: "Go back"
    timeout: 10000
- assertVisible: "Notifications"
- tapOn: "Go back"
