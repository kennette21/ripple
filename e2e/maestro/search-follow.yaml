appId: com.proxy.ripple
name: Community search follow state
---
- launchApp:
    clearState: true
    clearKeychain: true

- extendedWaitUntil:
    visible: "you@example.com"
    timeout: 15000
- tapOn: "you@example.com"
- inputText: "cicero@gmail.com"
- tapOn: "Enter your password"
- inputText: "12345678"
- hideKeyboard
- tapOn: "Sign In"
- extendedWaitUntil:
    visible:
      id: "feed-list"
    timeout: 15000

- tapOn: "Find friends"
- extendedWaitUntil:
    visible: "Search All People"
    timeout: 10000
- tapOn: "Search All People"
- inputText: "Marcus Aurelius"
- hideKeyboard
- extendedWaitUntil:
    visible: "Follow Marcus Aurelius"
    timeout: 10000

# The result-scoped follow state must refresh after both mutation directions.
- tapOn: "Follow Marcus Aurelius"
- extendedWaitUntil:
    visible: "Unfollow Marcus Aurelius"
    timeout: 10000
- tapOn: "Unfollow Marcus Aurelius"
- extendedWaitUntil:
    visible: "Follow Marcus Aurelius"
    timeout: 10000
